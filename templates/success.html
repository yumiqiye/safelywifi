<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>认证成功</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #4caf50; }
        .icon { font-size: 4rem; margin: 1rem 0; }
        p { color: #666; line-height: 1.6; }
        .btn { display: inline-block; padding: 0.75rem 1.5rem; background: #007bff; color: white; text-decoration: none; border-radius: 4px; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✅</div>
        <h2>认证成功！</h2>
        <p>您已成功通过 Wi-Fi 认证，现在可以访问互联网。</p>
        <p style="font-size: 0.9rem; color: #888;">祝您上网愉快！</p>
        
        <a href="/logout" class="btn">退出登录</a>
    </div>
</body>
</html>
