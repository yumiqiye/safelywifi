<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>后台管理 - 用户审核</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #1890ff; padding-bottom: 10px; color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #fafafa; font-weight: 600; }
        .status-pending { color: #faad14; font-weight: bold; }
        .status-approved { color: #52c41a; font-weight: bold; }
        .status-rejected { color: #ff4d4f; font-weight: bold; }
        .btn { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; color: white; font-size: 12px; }
        .btn-approve { background: #52c41a; }
        .btn-reject { background: #ff4d4f; }
        .btn:hover { opacity: 0.8; }
        .empty { text-align: center; color: #999; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>用户认证审核后台</h2>
        <p>当前待审核/已注册用户列表：</p>
        
        {% if users %}
        <table>
            <thead>
                <tr>
                    <th>账号</th>
                    <th>MAC 地址</th>
                    <th>IP 地址</th>
                    <th>申请时间</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                {% for username, info in users.items() %}
                <tr>
                    <td>{{ username }}</td>
                    <td>{{ info.mac }}</td>
                    <td>{{ info.ip }}</td>
                    <td>{{ info.time }}</td>
                    <td class="status-{{ info.status }}">{{ info.status }}</td>
                    <td>
                        {% if info.status == 'pending' %}
                        <button class="btn btn-approve" onclick="action('{{ username }}', 'approve')">通过</button>
                        <button class="btn btn-reject" onclick="action('{{ username }}', 'reject')">拒绝</button>
                        {% else %}
                        -
                        {% endif %}
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <div class="empty">暂无用户申请</div>
        {% endif %}
    </div>

    <script>
        function action(username, type) {
            if(!confirm('确定要' + (type === 'approve' ? '通过' : '拒绝') + '用户 ' + username + ' 吗？')) return;
            
            fetch('/' + type + '/' + username, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    alert(data.message);
                    location.reload();
                });
        }
    </script>
</body>
</html>
